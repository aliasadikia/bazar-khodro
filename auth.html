<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود و ثبت‌نام | ماشین آنلاین</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 20px;
      padding: 32px 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .brand-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin-bottom: 24px;
      gap: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      transition: color 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
    }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-size: 15px;
      direction: ltr;
      text-align: right;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(30, 58, 138, 0.1);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--primary-hover);
    }

    .back-action {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
      cursor: pointer;
    }

    .back-action:hover {
      color: var(--primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.25s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="auth-container">
  <div class="brand-header">
    <h1>ماشین آنلاین</h1>
    <p>ورود و عضویت در سامانه خودرو</p>
  </div>

  <!-- تب‌های انتخاب ورود / ثبت‌نام -->
  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="switchAuthTab('login')">ورود به حساب</button>
    <button type="button" class="tab-btn" onclick="switchAuthTab('register')">ثبت‌نام جدید</button>
  </div>

  <!-- فرم ۱: ورود -->
  <form id="login-form" class="tab-content active" onsubmit="event.preventDefault(); handleLogin();">
    <div class="form-group">
      <label for="login-mobile">شماره موبایل</label>
      <input type="tel" id="login-mobile" class="form-control" placeholder="09123456789" maxlength="11" required>
    </div>

    <div class="form-group">
      <label for="login-pass">رمز عبور</label>
      <input type="password" id="login-pass" class="form-control" placeholder="رمز عبور خود را وارد کنید" required>
    </div>

    <button type="submit" class="btn">ورود به حساب کاربری</button>
  </form>

  <!-- فرم ۲: ثبت‌نام -->
  <form id="register-form" class="tab-content" onsubmit="event.preventDefault(); handleRegister();">
    <div class="form-group">
      <label for="reg-mobile">شماره موبایل</label>
      <input type="tel" id="reg-mobile" class="form-control" placeholder="09123456789" maxlength="11" required>
    </div>

    <div class="form-group">
      <label for="reg-pass">تعیین رمز عبور دلخواه</label>
      <input type="password" id="reg-pass" class="form-control" placeholder="حداقل ۴ کاراکتر" minlength="4" required>
    </div>

    <div class="form-group">
      <label for="reg-pass-confirm">تکرار رمز عبور</label>
      <input type="password" id="reg-pass-confirm" class="form-control" placeholder="تکرار رمز عبور" minlength="4" required>
    </div>

    <button type="submit" class="btn">ثبت‌نام و ایجاد حساب</button>
  </form>

  <a href="index.html" class="back-action">بازگشت به صفحه اصلی سایت ←</a>
</div>

<script>
  function switchAuthTab(type) {
    const tabs = document.querySelectorAll('.tab-btn');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');

    if (type === 'login') {
      tabs[0].classList.add('active');
      tabs[1].classList.remove('active');
      loginForm.classList.add('active');
      registerForm.classList.remove('active');
    } else {
      tabs[1].classList.add('active');
      tabs[0].classList.remove('active');
      registerForm.classList.add('active');
      loginForm.classList.remove('active');
    }
  }

  function handleRegister() {
    const mobile = document.getElementById('reg-mobile').value.trim();
    const pass = document.getElementById('reg-pass').value.trim();
    const passConfirm = document.getElementById('reg-pass-confirm').value.trim();

    if (!/^09[0-9]{9}$/.test(mobile)) {
      alert('لطفاً یک شماره موبایل معتبر ۱۱ رقمی وارد کنید.');
      return;
    }

    if (pass.length < 4) {
      alert('رمز عبور باید حداقل ۴ کاراکتر باشد.');
      return;
    }

    if (pass !== passConfirm) {
      alert('رمز عبور و تکرار آن یکسان نیستند!');
      return;
    }

    let users = JSON.parse(localStorage.getItem('registered_users')) || {};

    if (users[mobile]) {
      alert('این شماره موبایل قبلاً ثبت‌نام شده است! لطفاً وارد شوید.');
      switchAuthTab('login');
      document.getElementById('login-mobile').value = mobile;
      return;
    }

    users[mobile] = pass;
    localStorage.setItem('registered_users', JSON.stringify(users));
    localStorage.setItem('userLoggedIn', 'true');
    localStorage.setItem('currentUserPhone', mobile);

    alert('ثبت‌نام شما با موفقیت انجام شد!');
    window.location.href = "index.html";
  }

  function handleLogin() {
    const mobile = document.getElementById('login-mobile').value.trim();
    const pass = document.getElementById('login-pass').value.trim();

    if (!mobile || !pass) {
      alert('لطفاً شماره موبایل و رمز عبور را وارد کنید.');
      return;
    }

    let users = JSON.parse(localStorage.getItem('registered_users')) || {};

    if (!users[mobile]) {
      alert('حسابی با این شماره یافت نشد! لطفاً ابتدا ثبت‌نام کنید.');
      switchAuthTab('register');
      document.getElementById('reg-mobile').value = mobile;
      return;
    }

    if (users[mobile] === pass) {
      localStorage.setItem('userLoggedIn', 'true');
      localStorage.setItem('currentUserPhone', mobile);
      alert('خوش آمدید! با موفقیت وارد شدید.');
      window.location.href = "index.html";
    } else {
      alert('رمز عبور وارد شده اشتباه است!');
    }
  }
</script>

</body>
</html>
